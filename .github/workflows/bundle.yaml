name: bundle

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - dist/**
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: ${{ github.workflow }}

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JesseTG/rm@v1.0.3
        with:
          path: dist

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - run: pnpm install && ONLY_SRC=true pnpm build
      - name: Only keep 角色卡示例 in dist for template upstream
        if: github.repository == 'StageDog/tavern_helper_template'
        run: |
          mv dist/角色卡示例 角色卡示例
          rm -rf dist
          mkdir dist
          mv 角色卡示例 dist/
      - name: Remove 示例 in dist for templated repository
        if: github.repository != 'StageDog/tavern_helper_template'
        run: |
          rm -rf dist/角色卡示例 dist/脚本示例 dist/流式楼层界面示例 dist/前端界面示例
          node -e "
            const fs = require('fs');
            if (fs.existsSync('dist/时空回溯系统/index.js') && fs.existsSync('src/时空回溯系统/时空回溯系统-酒馆助手脚本-本地版.json')) {
              const code = fs.readFileSync('dist/时空回溯系统/index.js', 'utf8');
              const localPath = 'src/时空回溯系统/时空回溯系统-酒馆助手脚本-本地版.json';
              const cloudPath = 'src/时空回溯系统/时空回溯系统-酒馆助手脚本-云端版.json';
              const localJson = JSON.parse(fs.readFileSync(localPath, 'utf8'));
              localJson.content = code;
              fs.writeFileSync(localPath, JSON.stringify(localJson, null, 2) + '\n', 'utf8');
              fs.copyFileSync(localPath, 'dist/时空回溯系统/时空回溯系统-酒馆助手脚本-本地版.json');
              if (fs.existsSync(cloudPath)) {
                fs.copyFileSync(cloudPath, 'dist/时空回溯系统/时空回溯系统-酒馆助手脚本-云端版.json');
              }
            }
          "
      - name: Commit changes
        uses: EndBug/add-and-commit@v9.1.3
        with:
          default_author: github_actions
          message: '[bot] bundle'

      # 自动打版本 tag, 从而让 jsdelivr 基于版本号在 12h 内更新缓存而不是用非版本号的 7d 缓存
      - id: autotag
        if: github.repository != 'StageDog/tavern_helper_template'
        uses: phish108/autotag-action@v1.1.64
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          with-v: true
      - if: ${{ github.repository != 'StageDog/tavern_helper_template' && steps.autotag.outputs.tag != '0.0.0' && steps.autotag.outputs.new-tag != steps.autotag.outputs.tag }}
        run: git push --delete origin ${{ steps.autotag.outputs.tag }}
